name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Tests (couverture minimale 80 %)
        run: uv run pytest -m "not slow" --cov=medai_ml --cov=app --cov-fail-under=80
      - name: Tests sur données réelles (téléchargement MedMNIST 28x28)
        run: uv run pytest -m slow

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Tests de bout en bout (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: uv sync --frozen
      - name: Données de test synthétiques (aucune valeur scientifique)
        run: |
          uv run python scripts/make_fixture.py "$RUNNER_TEMP/medai-fixture"
          mkdir -p "$RUNNER_TEMP/medai-empty/reports"
      - working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          API_URL=http://127.0.0.1:8100 pnpm build
          mkdir -p .next/standalone/.next && cp -r .next/static .next/standalone/.next/static
          pnpm exec playwright install --with-deps chromium
      - working-directory: apps/web
        env:
          CI: "1"
          MEDAI_FIXTURE: ${{ runner.temp }}/medai-fixture
          MEDAI_EMPTY: ${{ runner.temp }}/medai-empty
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          if-no-files-found: ignore

  docker:
    name: Images Docker et démarrage de la pile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Rapport synthétique pour le test de démarrage
        run: |
          uv run python scripts/make_fixture.py "$RUNNER_TEMP/fx"
          cp -r "$RUNNER_TEMP/fx/reports/." reports/
          cp -r "$RUNNER_TEMP/fx/artifacts/." artifacts/
      - name: Construire l'image API
        run: docker build -f infra/api.Dockerfile -t medai-api:ci .
      - name: Construire l'image web
        run: docker build -f infra/web.Dockerfile -t medai-web:ci .
      - run: docker compose build
      - name: Démarrer la pile
        run: docker compose up -d
      - name: Attendre l'API
        run: |
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8000/health && exit 0 || sleep 3
          done
          exit 1
      - name: Attendre l'interface
        run: |
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:3000/limites >/dev/null && exit 0 || sleep 3
          done
          exit 1
      - name: L'API sert le rapport
        run: curl -fsS http://127.0.0.1:8000/evaluations | grep -q simple_cnn
      - name: L'interface affiche la mise en garde
        run: curl -fsS http://127.0.0.1:3000/ | grep -q "Ne pas utiliser pour un diagnostic"
      - name: L'interface relaie l'API
        run: curl -fsS http://127.0.0.1:3000/api/health | grep -q '"status":"ok"'
      - name: Journaux Docker en cas d'échec
        if: failure()
        run: |
          {
            docker compose ps -a
            docker compose logs --no-color --tail 60
          } > "$RUNNER_TEMP/dc.log" 2>&1 || true
          msg=$(tail -c 6000 "$RUNNER_TEMP/dc.log" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=docker compose::$msg"
      - if: always()
        run: docker compose down -v
