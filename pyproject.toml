[project]
name = "medai-lab"
version = "0.1.0"
description = "Plateforme d'évaluation de modèles d'IA pour l'imagerie médicale (prototype de recherche, aucun usage clinique)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pillow>=10.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "medmnist>=3.0.2",
  "imagehash>=4.3",
  "torch>=2.4",
  "torchvision>=0.19",
  "timm>=1.0",
  "grad-cam>=1.5",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "httpx>=0.27",
  "types-PyYAML",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["ml", "services/api"]
include = ["medai_ml*", "app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["ml/tests", "services/api/api_tests"]
addopts = "-q"
markers = ["slow: tests longs ou nécessitant le réseau"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["ml", "services/api"]
extend-exclude = ["notebooks", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["ml/medai_ml", "services/api/app"]
